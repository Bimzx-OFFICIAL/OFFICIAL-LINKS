<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="icon" type="jpeg" href="Bimzx PP.jpeg"
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimzx GAMING</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #0d0d0d;
      color: #fff;
      background-image: url(https://ibb.co.com/DjBm20v.jpg);
      background-size: cover;
      background-position: center;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #1a1a1a;
      color: #fff;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid #848484;
    }
    .link {
      font-weight: bold;
      display: block;
      padding: 15px;
      margin: 10px 0;
      background-color: #6200ea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: transform 0.2s, background-color 0.2s;
    }
    .link:hover {
      transform: scale(1.05);
      background-color: #3700b3;
      
    }
    .stats {
      margin-top: 20px;
      font-size: 1.2em;
    }
    .stats span {
      display: block;
      margin: 10px 0;
    }
    .social-links {
      margin-top: 20px;
    }
    .social-links a {
      margin: 0 10px;
      color: #6200ea;
      font-size: 24px;
      transition: color 0.2s;
    }
    .social-links a:hover {
      color: #3700b3;
    }
    .typing-effect {
      font-size: 48;
      font-weight: bold;
      background: linear-gradient(90deg, red, #cc800a, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 1.5em;
      margin-bottom: 20px;
      color: transparent;
    }
    .social-media {
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Bimzx PP.jpeg" alt="Profile" class="profile-img">
    <div class="typing-effect" id="typing-effect"></div>
     
     <style>
       .stats {
         font-weight: bold;
         font-style: italic;
     }
     </style>
    <div class="stats">
      <span>NAMA: Bimzx</span>
      <span>Fav GAME: FREE FIRE</span>
    </div>
    
    <div class="bimzx"
    <span></span>
      
    </div>
      
    <div class="social-media">
      <span>💕SOCIAL MEDIA LINKS!</span>
      <div class="effect-scl-media" id="effect-scl-media"></div>
    </div>
    
    <a href="https://youtube.com/@bimzxgaming?si=jc1CNHOzCoi-WtAj" class="link">YOUTUBE</a>
    <a href="https://www.tiktok.com/@bimzx.xiterr" class="link">TIKTOK</a>
    <a href="https://sociabuzz.com/bimzxbaim/support" class="link">DONATE</a>
    <a href="https://whatsapp.com/channel/0029Vb38t28CnA82QHLPQj0P" class="link">SALURAN WA</a>

  </div>

  <script>

    const typingElement = document.getElementById('typing-effect');
    const texts = ["Halo Guys! ❤️", "Welcome To Link OFFICIAL Bimzx GAMING!", "Yang Mau Donate Link Di Bawah", "TERIMA KASIH💕"];
    
    let textIndex = 0;
    let charIndex = 0;
    
    const typeText = () => {
      if (charIndex < texts[textIndex].length) {
        typingElement.textContent += texts[textIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeText, 150);
      } else {
        setTimeout(eraseText, 2000);
      }
    };

    const eraseText = () => {
      if (charIndex > 0) {
        typingElement.textContent = texts[textIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseText, 50);
      } else {
        textIndex = (textIndex + 1) % texts.length;
        setTimeout(typeText, 600);
      }
    };

    typeText();
  </script>
</body>
</html>
